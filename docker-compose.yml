services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement-password-change-me
      POSTGRES_DB: placement
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://placement:placement-password-change-me@db:5432/placement
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
